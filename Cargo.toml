[package]
name = "star-catalog"
version = "0.3.0"
edition = "2024"
readme = "README.md"
authors = ["Gavin J Stark"]
description = "A star catalog library and tool with loadable catalogs that are searchable by geometry"
homepage = "https://github.com/atthecodeface/star-catalog-rs"
documentation = "https://docs.rs/star-catalog"
keywords = ["astronomy", "star", "catalog"]
categories = ["science"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/atthecodeface/star-catalog-rs"

[features]
# default = ["postcard"]
default = ["postcard", "image", "hipp_bright"]
image = ["dep:image"]
csv = ["dep:csv"]
postcard = ["dep:postcard"]
hipp_bright = ["dep:postcard"]

[dependencies.serde_json]
version = "1.0"
features = ["alloc"]

[dependencies.postcard]
version = "1.1"
features = ["alloc"]
optional = true

[dependencies.geo-nd]
version = "0.6.4"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.csv]
version = "1.3"
optional = true

[dependencies.thiserror]
version = "2.0"

[dependencies.anyhow]
version = "1.0"

[dependencies.clap]
version = "4.5"
features = ["string"]

[dependencies.image]
version = "0.25"
default-features = false
features = ["jpeg", "png"]
optional = true
